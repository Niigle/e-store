spring.application.name=e-store
spring.main.banner-mode=off

spring.datasource.url=jdbc:mysql://localhost:3306/e_store?useSSL=false&serverTimezone=Europe/Belgrade&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false

spring.security.user.name=admin
spring.security.user.password=admin.123

app.jwt.secret=YjM2N2E5ZTU0Y2QxNDY4Y2I5N2U1NmQyZGU3ODkwYjI4ZjQzM2Q1YzA5YjE2N2E4ZmQ0YjI5YzEwZTJlM2Y0YQ==
app.jwt.expiration-ms=9360000


spring.cache.type=caffeine
spring.cache.cache-names=users,exchangeRatesById,exchangeRatesList,exchangeRatesDate,exchangeRates,storeProductsAll,storeProductsById,storeProductsByStore,storeProductsByProduct
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

logging.file.name=logs/app.log
logging.level.org.springframework.web=INFO

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
management.health.rabbit.enabled=false